[PARSER]
    Name        traefik_access
    Format      regex

    Regex       ^(?<client_ip>[^ ]+) [^ ]+ [^ ]+ \[(?<timestamp>[^\]]+)\] "(?<method>[A-Z]+) (?<path>[^ ]+) (?<protocol>[^"]+)" (?<status_code>[0-9]+) (?<response_size>[0-9]+) "(?<referer>[^"]*)" "(?<user_agent>[^"]*)" (?<request_id>[^ ]+) "(?<router>[^"]*)" "(?<service>[^"]*)" (?<duration>[0-9]+)ms$

    Time_Key    timestamp
    Time_Format %d/%b/%Y:%H:%M:%S %z


[PARSER]
    Name        docker_json
    Format      json

    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    Time_Keep   On