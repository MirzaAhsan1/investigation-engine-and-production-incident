[SERVICE]
    Flush        1
    Log_Level    info

    Parsers_File ./fluent-bit/parsers.conf


# ==========================================================
# TRAEFIK ACCESS LOG
# ==========================================================

[INPUT]
    Name              tail

    Tag               traefik.access

    Path              /var/log/traefik/access.log

    Parser            traefik_access

    Read_from_Head    On

    Skip_Long_Lines   On


# ==========================================================
# CONVERT TRAEFIK EVENT → METRIC EVENT
# ==========================================================

[FILTER]
    Name              lua

    Match             traefik.access

    script            ./fluent-bit/scripts/traefik_to_metrics.lua

    call              transform_traefik


# ==========================================================
# ADD MONITORING METADATA
# ==========================================================

[FILTER]
    Name              modify

    Match             traefik.access

    Add               api_key ${MONITORING_API_KEY}

    Add               host production-server

    Add               container_name backend-api


# ==========================================================
# DEBUG OUTPUT
# ==========================================================

[OUTPUT]
    Name              stdout

    Match             traefik.access

    Format            json_lines