[SERVICE]
    Flush        2
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers-docker.conf
    Parsers_File /fluent-bit/etc/parsers.conf


[INPUT]
    Name              tail
    Tag               fraud-dummy.logs
    Path              /var/lib/docker/containers/ada4a825d0be037ce5e782b0072786961bff4465aeee39ddbd544216e99b079d/*-json.log
    Parser            docker_json
    DB                /tmp/flb-docker.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  2

[FILTER]
    Name    parser
    Match   fraud-dummy.logs

    Key_Name       log
    Parser         app_log
    Reserve_Data   On


[FILTER]
    Name    modify
    Match   fraud-dummy.logs

    Rename  time timestamp


[FILTER]
    Name    modify
    Match   fraud-dummy.logs

    Add    api_key b4c7bfc5a797e94482a67da6564f97fb63797439e9d421227755c762b3cf80f5
    Add    container_name fraud-dummy
    Add    host fraud-server-01

