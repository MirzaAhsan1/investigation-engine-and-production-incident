[SERVICE]
    Flush              5
    Log_Level          info


# ==========================================================
# TRAEFIK ACCESS LOG INPUT
# ==========================================================

[INPUT]
    Name               tail

    Tag                traefik.access

    Path               /var/log/traefik/access.log

    Read_from_Head     On

    Refresh_Interval   2

    Skip_Long_Lines    On

    Mem_Buf_Limit      10MB


# ==========================================================
# TRAEFIK LOG PARSER
# ==========================================================

[PARSER]
    Name        traefik

    Format      regex

    Regex       ^(?<client_ip>\S+) - - \[(?<time>[^\]]+)\] "(?<method>\S+) (?<path>\S+) (?<protocol>[^"]+)" (?<status_code>\d+) (?<response_size>\d+) "(?<referer>[^"]*)" "(?<user_agent>[^"]*)" (?<request_id>\d+) "(?<router>[^"]*)" "(?<service>[^"]*)" (?<duration>\d+)ms$

    Time_Key    time

    Time_Format %d/%b/%Y:%H:%M:%S %z


# ==========================================================
# PARSE TRAEFIK LOG
# ==========================================================

[FILTER]
    Name               parser

    Match              traefik.access

    Key_Name           log

    Parser             traefik

    Reserve_Data       On

    Preserve_Key       Off


# ==========================================================
# ADD MONITORING IDENTIFICATION
# ==========================================================

[FILTER]
    Name               modify

    Match              traefik.access

    Add                api_key ${MONITORING_API_KEY}

    Add                host production-server

    Add                container_name backend-api


# ==========================================================
# AGGREGATE TRAEFIK METRICS
# ==========================================================

[FILTER]
    Name               lua

    Match              traefik.access

    Script             /home/mirza-ahsan/ahsan/ai-engineering/investigation-engine-and-production-incident/backend/fluent-bit/scripts/traefik_metrics.lua

    Call               aggregate_traefik


# ==========================================================
# SEND METRICS TO FASTAPI
# ==========================================================

[OUTPUT]
    Name               http

    Match              traefik.access

    Host               127.0.0.1

    Port               8000

    URI                /api/metrics/ingest

    Format             json

    Json_date_key      timestamp

    Json_date_format   iso8601

    tls                Off


# ==========================================================
# DEBUG OUTPUT
# ==========================================================

[OUTPUT]
    Name               stdout

    Match              traefik.access

    Format             json