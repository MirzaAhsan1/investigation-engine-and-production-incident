[SERVICE]
    Flush        5
    Log_Level    info

# ============================================================
# LOGS
# ============================================================

# [INPUT]
#     Name              tail
#     Tag               redix.*
#     Path              /var/log/containers/*.log
#     Parser            docker
#     DB                /var/log/fluent-bit/flb.db

# [FILTER]
#     Name              modify
#     Match             redix.*
#     Add               api_key b4c7bfc5a797e94482a67da6564f97fb63797439e9d421227755c762b3cf80f5
#     Add               host redix-server-01
#     Add               container_name redix-app

# [OUTPUT]
#     Name              http
#     Match             redix.*
#     Host              starting-gratitude-papaya.ngrok-free.dev
#     Port              443
#     URI               /api/logs/ingest
#     Format            json
#     tls               On
#     Header            ngrok-skip-browser-warning true

# ============================================================
# METRICS - CPU / MEMORY / DISK
# ============================================================

[INPUT]
    Name              cpu
    Tag               system.metrics.cpu
    Interval_Sec      10

[INPUT]
    Name              mem
    Tag               system.metrics.memory
    Interval_Sec      10

[INPUT]
    Name              disk
    Tag               system.metrics.disk
    Interval_Sec      10

[FILTER]
    Name              modify
    Match             system.metrics.*
    Add               api_key b4c7bfc5a797e94482a67da6564f97fb63797439e9d421227755c762b3cf80f5
    Add               host redix-server-01
    Add               container_name redix-app

[OUTPUT]
    Name              http
    Match             system.metrics.*
    Host              starting-gratitude-papaya.ngrok-free.dev
    Port              443
    URI               /api/metrics/ingest
    Format            json
    tls               On
    Header            ngrok-skip-browser-warning true