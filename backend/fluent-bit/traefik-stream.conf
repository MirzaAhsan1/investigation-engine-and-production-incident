[STREAM_TASK]
    Name              traefik_metrics

    Exec              CREATE STREAM traefik_metrics WITH (tag='traefik.metrics') AS SELECT \
                      AVG(CAST(duration AS DOUBLE)) AS api_latency, \
                      SUM(CASE WHEN CAST(status_code AS INTEGER) >= 500 THEN 1 ELSE 0 END) AS http_5xx_count, \
                      SUM(CASE WHEN CAST(status_code AS INTEGER) >= 400 AND CAST(status_code AS INTEGER) < 500 THEN 1 ELSE 0 END) AS http_4xx_count, \
                      COUNT(*) / 10.0 AS request_per_second, \
                      FIRST_VALUE(api_key) AS api_key, \
                      FIRST_VALUE(host) AS host, \
                      FIRST_VALUE(container_name) AS container_name \
                      FROM TAG:'traefik.access' \
                      WINDOW TUMBLING 10 SECOND