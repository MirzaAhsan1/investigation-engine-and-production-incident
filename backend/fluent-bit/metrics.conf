[SERVICE]
    Flush        5
    Log_Level    info


# ==========================================================
# CPU METRICS
# ==========================================================

[INPUT]
    Name              cpu
    Tag               system.cpu
    Interval_Sec      10


# ==========================================================
# MEMORY METRICS
# ==========================================================

[INPUT]
    Name              mem
    Tag               system.memory
    Interval_Sec      10


# ==========================================================
# DISK METRICS
# ==========================================================

[INPUT]
    Name              exec
    Tag               system.disk
    Command           /bin/bash /app/fluent-bit/scripts/disk_metrics.sh
    Interval_Sec      10
    Parser            disk_metrics


# ==========================================================
# CPU FILTER
# ==========================================================

[FILTER]
    Name              lua
    Match             system.cpu
    Script            /app/fluent-bit/scripts/metrics.lua
    Call              process_cpu


# ==========================================================
# MEMORY FILTER
# ==========================================================

[FILTER]
    Name              lua
    Match             system.memory
    Script            /app/fluent-bit/scripts/metrics.lua
    Call              process_memory


# ==========================================================
# DISK FILTER
# ==========================================================

[FILTER]
    Name              lua
    Match             system.disk
    Script            /app/fluent-bit/scripts/metrics.lua
    Call              process_disk


# ==========================================================
# METRIC METADATA
# ==========================================================

[FILTER]
    Name              modify
    Match             system.*
    Add               api_key ${MONITORING_API_KEY}
    Add               host production-server
    Add               container_name backend-api


# ==========================================================
# DEBUG OUTPUT
# ==========================================================

[OUTPUT]
    Name              stdout
    Match             system.*
    Format            json


# ==========================================================
# BACKEND METRIC API
# ==========================================================

[OUTPUT]
    Name              http
    Match             system.*
    Host              127.0.0.1
    Port              8000
    URI               /api/metrics/ingest
    Format            json
    Json_date_key     timestamp
    Json_date_format  iso8601