[SERVICE]
    Flush        5
    Log_Level    info

    Parsers_File /home/mirza-ahsan/ahsan/ai-engineering/investigation-engine-and-production-incident/backend/fluent-bit/parsers.conf


# ============================================================
# LOGS
# ============================================================

[INPUT]
    Name              tail
    Tag               redix.logs
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker_json
    DB                /var/lib/fluent-bit/flb.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5


[FILTER]
    Name              lua
    Match             redix.logs
    Script            /home/mirza-ahsan/ahsan/ai-engineering/investigation-engine-and-production-incident/backend/fluent-bit/scripts/docker_log_mapper.lua
    Call              map_docker_log


[FILTER]
    Name              modify
    Match             redix.logs

    Add               api_key b4c7bfc5a797e94482a67da6564f97fb63797439e9d421227755c762b3cf80f5
    Add               host redix-server-01
    Add               container_name redix-app


[OUTPUT]
    Name              http
    Match             redix.logs

    Host              host.docker.internal
    Port              8000
    URI               /api/logs/ingest

    Format            json

    Header            Content-Type application/json


# ============================================================
# METRICS
# ============================================================

# CPU
[INPUT]
    Name              cpu
    Tag               system.metrics.cpu
    Interval_Sec      10


# MEMORY
[INPUT]
    Name              mem
    Tag               system.metrics.memory
    Interval_Sec      10


# DISK
[INPUT]
    Name              disk
    Tag               system.metrics.disk
    Interval_Sec      10


# ============================================================
# METRIC AGGREGATION
#
# CPU + MEMORY + DISK
#        ↓
# Lua aggregator
#        ↓
# ONE combined metric
#        ↓
# Metrics API
# ============================================================

[FILTER]
    Name              lua
    Match             system.metrics.*
    Script            /home/mirza-ahsan/ahsan/ai-engineering/investigation-engine-and-production-incident/backend/fluent-bit/scripts/metrics_aggregator.lua
    Call              aggregate_metrics


# ============================================================
# METADATA
# ============================================================

[FILTER]
    Name              modify
    Match             system.metrics.*

    Add               api_key b4c7bfc5a797e94482a67da6564f97fb63797439e9d421227755c762b3cf80f5
    Add               host redix-server-01
    Add               container_name redix-app


# ============================================================
# METRICS API
# ============================================================

[OUTPUT]
    Name              http
    Match             system.metrics.*

    Host              host.docker.internal
    Port              8000
    URI               /api/metrics/ingest

    Format            json

    Header            Content-Type application/json