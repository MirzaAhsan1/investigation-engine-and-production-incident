[SERVICE]
    Flush        1
    Log_Level    info

    Parsers_File ./fluent-bit/parsers.conf


# ==========================================================
# TRAEFIK ACCESS LOG
# ==========================================================

[INPUT]
    Name              tail

    Tag               traefik.access

    Path              /var/log/traefik/access.log

    Parser            traefik_access

    Read_from_Head    On

    Refresh_Interval  2

    Skip_Long_Lines   On


# ==========================================================
# DEBUG OUTPUT
# ==========================================================

[OUTPUT]
    Name              stdout

    Match             traefik.access

    Format            json_lines